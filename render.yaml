services:
  - type: web
    name: english-app
    runtime: node
    plan: free

    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run build:production
    startCommand: corepack pnpm run start:production

    healthCheckPath: /api/healthz

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: DATABASE_URL
        fromDatabase:
          name: english-app-db
          property: connectionString

      - key: BASE_PATH
        value: /

databases:
  - name: english-app-db
    plan: free
    databaseName: english_app
    user: english_app